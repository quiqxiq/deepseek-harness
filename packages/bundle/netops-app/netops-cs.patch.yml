# Read-only even if a future tool reaches the sandbox.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
    additionalWritableRoots: []

- insert:
    # The read-only token hides mutation tools at the server; the guard below
    # denies anything outside the fixed read-only catalog.
    - id: mcp-polyglot-readonly
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: polyglot
        transport: streamable-http
        url: !!js process.env.POLYGLOT_MCP_URL ?? 'http://127.0.0.1:8080/mcp'
        headers: !!js "process.env.POLYGLOT_MCP_READ_TOKEN ? { Authorization: 'Bearer ' + process.env.POLYGLOT_MCP_READ_TOKEN } : {}"
        toolCallTimeoutMs: 30000
        failOnStartupError: true

    - id: netops-read-only-guard
      name: '@deepseek-ai/dsh-netops-app/read-only-guard'
